
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Димас, у нас все получится!</title>
<link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: radial-gradient(
    ellipse at center,
    #220044 0%,
    #09001b 65%,
    #000 100%
  );
  font-family: "Balsamiq Sans", Arial, sans-serif;
  color: yellow;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.scene {
  position: relative;
  z-index: 1;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 60px;
  padding: 20px;
  text-align: center;
}

h1 {
  margin: 0;
  font-size: clamp(32px, 8vw, 76px);
  line-height: 1.15;
  color: #ffff00;
  text-shadow:
    3px 3px #ff0000,
    -3px -3px #00ffff,
    6px 6px #ff00ff,
    0 0 25px #ff0;
  animation:
    appear 1s ease-out,
    wiggle 0.4s infinite alternate;
}

.final {
  opacity: 0;
  transform: scale(0.1) rotate(-20deg);
  font-size: clamp(30px, 8vw, 72px);
  font-weight: 900;
  color: #00ff00;
  text-shadow:
    3px 3px #ff00ff,
    -3px -3px #ffff00,
    0 0 25px #00ff00;
  transition: opacity 0.3s, transform 0.7s;
}

.final.show {
  opacity: 1;
  transform: scale(1) rotate(0);
  animation: blink 0.6s infinite alternate;
}

@keyframes appear {
  from { transform: scale(0) rotate(360deg); }
  to { transform: scale(1) rotate(0); }
}

@keyframes wiggle {
  from { transform: rotate(-2deg); }
  to { transform: rotate(2deg); }
}

@keyframes blink {
  from { color: #00ff00; }
  to { color: #ff00ff; }
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="scene">
  <h1>Димас, у нас все получится!</h1>
  <div class="final" id="final">
    ДАВАЙ МУТИТЬ БИЗНЕС!!!
  </div>
</div>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
const particles = [];

let w, h;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  w = window.innerWidth;
  h = window.innerHeight;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();

const colors = [
  "#ff0000", "#00ff00", "#ffff00",
  "#00ffff", "#ff00ff", "#ff8800", "#ffffff"
];

function explode(x, y) {
  const color = colors[Math.floor(Math.random() * colors.length)];

  for (let i = 0; i < 75; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 5;
    const life = 45 + Math.random() * 35;

    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life,
      maxLife: life,
      color
    });
  }
}

function animate() {
  ctx.clearRect(0, 0, w, h);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.04;
    p.vx *= 0.99;
    p.life--;

    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);

    if (p.life <= 0) particles.splice(i, 1);
  }

  ctx.globalAlpha = 1;
  requestAnimationFrame(animate);
}

animate();

// Запускаем бесконечный салют
setTimeout(() => {
  setInterval(() => {
    explode(
      50 + Math.random() * (w - 100),
      50 + Math.random() * (h * 0.65)
    );
  }, 450);
}, 800);

// Финальная надпись через 6 секунд
setTimeout(() => {
  document.getElementById("final").classList.add("show");

  explode(w * 0.25, h * 0.4);
  explode(w * 0.50, h * 0.3);
  explode(w * 0.75, h * 0.4);
}, 6000);
</script>

</body>
</html>
